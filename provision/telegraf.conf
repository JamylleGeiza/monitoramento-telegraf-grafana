# Telegraf: coleta métricas da VM a cada 10s e envia para o InfluxDB

[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"
  omit_hostname = false

# ---------- SAÍDA (para onde vão as métricas) ----------
[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "token-demo-ifpe"
  organization = "ifpe"
  bucket = "telegraf"

# ---------- ENTRADAS (o que será coletado) ----------
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]

[[inputs.processes]]
