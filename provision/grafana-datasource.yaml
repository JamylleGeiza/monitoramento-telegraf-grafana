apiVersion: 1

datasources:
  - name: InfluxDB-Telegraf
    uid: influxdb-telegraf
    type: influxdb
    access: proxy
    url: http://localhost:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: ifpe
      defaultBucket: telegraf
    secureJsonData:
      token: token-demo-ifpe
